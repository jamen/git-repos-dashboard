<main id="main" class="container">
    <header class="site-header">
        <h1 class="title"><a href="/">git-repos-dashboard</a></h1>
    </header>

    <section class="section">
        <h2>Commit</h2>
        <article class="card">
            <h3><a class="repo-link" href="{{ repo_href }}">{{ repo }}</a> · <code>{{ short }}</code></h3>
            <p class="commit-summary">{{ summary }}</p>
            <dl class="details">
                <dt>commit</dt>
                <dd><code>{{ hash }}</code></dd>
                <dt>author</dt>
                <dd>{{ author }}</dd>
                <dt>date</dt>
                <dd>{{ when }}</dd>
            </dl>
            {% if !message.is_empty() %}
            <pre class="commit-body">{{ message }}</pre>
            {% endif %}
        </article>
    </section>
</main>
