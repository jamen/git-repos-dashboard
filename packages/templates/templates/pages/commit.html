<main id="main" class="container">
    <header class="site-header">
        <h1 class="title"><a class="repo-link" href="/">Repositories</a> › <a class="repo-link" href="{{ repo_href }}">{{ repo }}</a>{% if !branch.is_empty() %} › <a class="repo-link" href="{{ branch_href }}">branch {{ branch }}</a>{% endif %} › <a class="repo-link" href="{{ current_href }}">commit {{ short }}</a></h1>
        <div class="site-actions">
            <a class="search-toggle" href="{{ search_href }}">Search</a>
        </div>
    </header>

    <section class="section">
        <article class="card">
            <p class="commit-summary">{{ summary }}</p>
            <dl class="details">
                <dt>author</dt>
                <dd>{{ author }}</dd>
                <dt>date</dt>
                <dd class="commit-time">{{ when }}</dd>
            </dl>
            {% if !message.is_empty() %}
            <pre class="commit-body">{{ message }}</pre>
            {% endif %}
        </article>
    </section>
</main>
